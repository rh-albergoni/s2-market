<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B7A4B">
<title>Mercado do mês</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3EC; --paper:#FFFFFF; --ink:#16241B; --muted:#5E6E63; --line:#D5DED6;
  --green:#2B7A4B; --green-soft:#DCEEDF; --tag:#F4C531; --tag-ink:#2A2100; --red:#C63D2A; --home:#7A6A2E; --home-soft:#F5EDCB;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101812; --paper:#18241B; --ink:#E6EEE7; --muted:#95A69A; --line:#2A3A2E;
  --green:#5CC486; --green-soft:#1F3A28; --tag:#E9BC2A; --tag-ink:#231B00; --red:#F07A63; --home:#E0C878; --home-soft:#3A331A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#101812; --paper:#18241B; --ink:#E6EEE7; --muted:#95A69A; --line:#2A3A2E;
  --green:#5CC486; --green-soft:#1F3A28; --tag:#E9BC2A; --tag-ink:#231B00; --red:#F07A63; --home:#E0C878; --home-soft:#3A331A; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3,.num{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif}
header h1{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 2px;letter-spacing:.02em}
.month{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.month h2{font-size:34px;margin:0;line-height:1;text-transform:capitalize}
.linkbtn{background:none;border:0;color:var(--green);font:600 15px Barlow,sans-serif;padding:6px 0;cursor:pointer}
.tagbig{display:inline-block;background:var(--tag);color:var(--tag-ink);border-radius:6px 16px 16px 6px;padding:6px 18px 6px 14px;position:relative;margin-top:14px}
.tagbig::before{content:"";position:absolute;left:6px;top:50%;width:7px;height:7px;margin-top:-3.5px;border-radius:50%;background:var(--bg)}
.tagbig .num{font-size:40px;font-weight:700;line-height:1;padding-left:10px}
.budget{color:var(--muted);font-size:15px;margin:8px 0 6px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.bar.over i{background:var(--red)}
.trips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:22px 0 14px}
.trip{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;font:inherit}
.trip b{display:block;font:700 20px "Barlow Condensed",sans-serif;line-height:1.1}
.trip span{font-size:12px;color:var(--muted)}
.trip.on{border-color:var(--green);background:var(--green-soft)}
.trip.done span{color:var(--green);font-weight:600}
.tripinfo{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.tripinfo h3{margin:0;font-size:22px}
.tripinfo p{margin:0;color:var(--muted);font-size:14px}
.filter{display:flex;background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-shrink:0}
.filter button{border:0;background:none;font:600 13px Barlow,sans-serif;padding:7px 10px;color:var(--muted);cursor:pointer}
.filter button.on{background:var(--ink);color:var(--bg)}
.hint{font-size:13px;color:var(--muted);margin:0 0 12px}
.sec{background:var(--paper);border-radius:12px;margin-bottom:12px;overflow:hidden;border:1px solid var(--line)}
.sec h4{margin:0;padding:10px 14px 6px;font:700 17px "Barlow Condensed",sans-serif;display:flex;justify-content:space-between}
.sec h4 small{font:500 13px Barlow,sans-serif;color:var(--muted)}
.item{display:flex;align-items:center;gap:10px;padding:9px 14px;border-top:1px solid var(--line);cursor:pointer;user-select:none}
.box{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-size:15px;color:#fff}
.item .txt{flex:1;min-width:0}
.item .nm{display:block}
.item .qt{font-size:13px;color:var(--muted)}
.item.cart .box{background:var(--green);border-color:var(--green)}
.item.cart .nm{text-decoration:line-through;color:var(--muted)}
.item.home .box{background:var(--home-soft);border-color:var(--home);color:var(--home);font-size:11px;font-weight:700}
.item.home .nm{color:var(--muted)}
.have{border:1px solid var(--line);background:none;color:var(--muted);font:500 12px Barlow,sans-serif;border-radius:20px;padding:4px 9px;cursor:pointer;flex-shrink:0}
.item.home .have{background:var(--home-soft);color:var(--home);border-color:var(--home)}
.del{border:0;background:none;color:var(--red);font-size:18px;padding:0 4px;cursor:pointer}
.add{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
input{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--green);outline-offset:1px}
.add input{flex:1}
.btn{border:0;background:var(--green);color:#fff;font:600 15px Barlow,sans-serif;border-radius:8px;padding:9px 14px;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:var(--red)}
.pay{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.pay label{display:block;font-weight:600;margin-bottom:6px}
.pay .row{display:flex;gap:8px;align-items:center}
.pay .row input{flex:1;font:700 22px "Barlow Condensed",sans-serif}
.pay p{margin:8px 0 0;font-size:14px;color:var(--muted)}
.pay p.good{color:var(--green)} .pay p.bad{color:var(--red)}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.hist{margin-top:26px}
.hist h3{font-size:22px;margin:0 0 8px}
.hist table{width:100%;border-collapse:collapse;background:var(--paper);border-radius:12px;overflow:hidden;font-size:15px}
.hist td,.hist th{padding:9px 12px;border-top:1px solid var(--line);text-align:left}
.hist th{font-weight:600;color:var(--muted);font-size:13px;border-top:0}
.hist td:not(:first-child),.hist th:not(:first-child){text-align:right}
.sync{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
.sync button{background:none;border:0;color:var(--green);font:600 12px Barlow,sans-serif;padding:4px;cursor:pointer}
dialog{border:0;border-radius:14px;background:var(--paper);color:var(--ink);padding:20px;max-width:340px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 8px;font-size:24px}
dialog p{margin:0 0 16px;color:var(--muted)}
dialog .acts{display:flex;gap:8px;justify-content:flex-end}
dialog input{width:100%;margin-bottom:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Mercado do mês · 3 pessoas</h1>
    <div class="month"><h2 id="mes"></h2><button class="linkbtn" id="fechar">Fechar mês</button></div>
    <div class="tagbig"><span class="num" id="gasto">R$ 0</span></div>
    <div class="budget" id="budget"></div>
    <div class="bar" id="bar"><i></i></div>
  </header>

  <nav class="trips" id="trips" aria-label="Idas ao mercado"></nav>

  <div class="tripinfo">
    <div><h3 id="tt"></h3><p id="ts"></p></div>
    <div class="filter" role="group" aria-label="Mostrar">
      <button data-f="falta" class="on">Faltam</button><button data-f="tudo">Tudo</button>
    </div>
  </div>
  <p class="hint">Toque no item quando colocar no carrinho. Use “tenho” para o que ainda sobrou em casa.</p>

  <div id="lista"></div>

  <div class="pay">
    <label for="nota">Valor pago no caixa</label>
    <div class="row"><input id="nota" inputmode="decimal" placeholder="0,00" autocomplete="off"><button class="btn" id="salvanota">Salvar</button></div>
    <p id="notamsg"></p>
  </div>

  <div class="sec" id="chegada"></div>

  <section class="hist" id="hist"></section>
  <p class="sync"><span id="sync"></span> <button id="config">configurar</button></p>
</div>

<dialog id="dlg">
  <h3>Fechar o mês?</h3>
  <p id="dlgtxt"></p>
  <div class="acts"><button class="btn ghost" id="dlgno">Cancelar</button><button class="btn" id="dlgok">Fechar mês</button></div>
</dialog>

<dialog id="dlgapi">
  <h3>Sincronizar</h3>
  <p>Cole a URL do Apps Script (termina em <code>/exec</code>). Deixe vazio para salvar só neste celular.</p>
  <input id="apiurl" inputmode="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec">
  <div class="acts"><button class="btn ghost" id="apino">Cancelar</button><button class="btn" id="apiok">Salvar</button></div>
</dialog>

<script>
const SEMANA=[
 ["Hortifrúti",[["Banana","2 kg"],["Maçã","1,5 kg"],["Laranja","2 kg"],["Mamão","2 unidades"],["Alface","2 unidades"],["Tomate","1 kg"],["Abobrinha","600 g"],["Limão","400 g"]]],
 ["Frios e padaria",[["Iogurte natural","1,5 kg"],["Queijo branco","300 g"],["Pão integral","2 pacotes"],["Chocolate","3 barras de 90–100 g"]]]
];
const ACOUGUE=["Açougue",[["Filé de peito de frango","6 kg"],["Patinho moído","3 kg"],["Pernil suíno sem osso","1,5 kg"]]];
const IDAS=[
 {id:"i1",dia:1,est:1535,nome:"Compra grande + semana",secs:[
   ACOUGUE,
   ["Ovos e congelados",[["Ovos","3 caixas de 20"],["Brócolis congelado","1 kg"]]],
   ["Grãos",[["Arroz","5 kg"],["Feijão carioca","4 pacotes de 1 kg"],["Aveia","900 g"],["Macarrão","2 pacotes de 500 g"]]],
   ["Mercearia",[["Café em grão","1,5 kg"],["Azeite","500 ml"],["Óleo","2 de 900 ml"],["Amendoim torrado sem sal","1 kg"],["Molho de tomate","3 sachês"],["Sal, alho e temperos",""]]],
   ["Hortifrúti",[["Batata-doce","4,5 kg"],["Cenoura","2 kg"],["Cebola","2 kg"],["Repolho","1 unidade grande"],...SEMANA[0][1]]],
   SEMANA[1],
   ["Limpeza",[["Sabão em pó","4 kg"],["Amaciante","2 L"],["Desinfetante","3 de 2 L"],["Água sanitária","3 de 2 L"],["Detergente de louça","8 unidades"],["Multiuso","2 unidades"],["Desengordurante","1 unidade"],["Gel ou bloco sanitário","kit p/ 3 banheiros"],["Esponjas, panos e luvas",""],["Papel higiênico","3 pacotes de 12"],["Saco de lixo","3 pacotes"],["Papel toalha","2 unidades"]]],
   ["Higiene",[["Sabonete","2 pacotes com 6"],["Pasta de dente",""],["Desodorante",""]]]
 ]},
 {id:"i2",dia:8,est:165,nome:"Só a compra da semana",secs:SEMANA},
 {id:"i3",dia:15,est:535,nome:"Meio do mês + semana",secs:[ACOUGUE,["Ovos e congelados",[["Ovos","1 caixa de 30 + 1 de 20"],["Brócolis congelado","1 kg"]]],...SEMANA]},
 {id:"i4",dia:22,est:165,nome:"Só a compra da semana",secs:SEMANA}
];
const EST=IDAS.reduce((s,i)=>s+i.est,0);
const CHEGADA={
 carne:"Porcionar as carnes em 200 g e 150 g, congelar achatado e anotar a data",
 choc:"Dividir o chocolate em 7 porções para cada um",
 guardar:"Guardar hortifrúti e conferir validade do iogurte"
};
function chegadaDe(t){return t.id==="i1"||t.id==="i3"?["carne","choc","guardar"]:["choc","guardar"]}

const mesAtual=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")};
const novo=(mes)=>({mes:mes||mesAtual(),itens:{},notas:{},extras:{},cheg:{},hist:[]});
let S=novo(), trip="i1", filtro="falta";

const brl=v=>v.toLocaleString("pt-BR",{style:"currency",currency:"BRL",maximumFractionDigits:v%1?2:0});
const parse=s=>{if(!s)return null;s=String(s).replace(/[^\d,.-]/g,"");if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");const n=parseFloat(s);return isFinite(n)?n:null};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mesNome=m=>{const[y,mo]=m.split("-");return new Date(+y,+mo-1,1).toLocaleDateString("pt-BR",{month:"long",year:"numeric"})};
const $=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};

function itensDe(t){
  const out=[];t.secs.forEach(([sec,arr],si)=>arr.forEach(([n,q],i)=>out.push({k:t.id+"_"+si+"_"+i,n,q,sec})));
  Object.entries(S.extras[t.id]||{}).sort(([a],[b])=>a<b?-1:1).forEach(([id,e])=>out.push({k:t.id+"_x_"+id,n:e.n,q:"",sec:"Extras",x:id}));
  return out;
}
function progresso(t){const it=itensDe(t);const f=it.filter(i=>S.itens[i.k]).length;return{f,n:it.length}}

function render(){
  // a lista é recriada inteira; preserva o que estiver sendo digitado em "adicionar item"
  const nv0=$("novo"), digitando=nv0&&document.activeElement===nv0, txt=nv0?nv0.value:"";

  $("mes").textContent=mesNome(S.mes);
  const gasto=IDAS.reduce((s,t)=>s+(S.notas[t.id]||0),0);
  $("gasto").textContent=brl(gasto);
  const pct=Math.min(100,gasto/EST*100);
  $("budget").textContent=gasto>EST?`${brl(gasto-EST)} acima do previsto de ${brl(EST)}`:`de ${brl(EST)} previstos · sobram ${brl(EST-gasto)}`;
  $("bar").className="bar"+(gasto>EST?" over":"");$("bar").firstElementChild.style.width=pct+"%";

  $("trips").innerHTML=IDAS.map(t=>{const p=progresso(t);const paid=S.notas[t.id]!=null;
    return `<button class="trip${t.id===trip?" on":""}${paid?" done":""}" data-t="${t.id}" aria-pressed="${t.id===trip}"><b>Dia ${t.dia}</b><span>${paid?brl(S.notas[t.id]):p.f+"/"+p.n}</span></button>`}).join("");

  const t=IDAS.find(x=>x.id===trip), p=progresso(t);
  $("tt").textContent=`Dia ${t.dia}`;
  $("ts").textContent=`${t.nome} · ~${brl(t.est)} · ${p.f} de ${p.n} resolvidos`;

  const grupos={};itensDe(t).forEach(i=>{(grupos[i.sec]=grupos[i.sec]||[]).push(i)});
  const extras=grupos.Extras||[];delete grupos.Extras;
  const row=i=>{const st=S.itens[i.k];return `<div class="item${st===1?" cart":st===2?" home":""}" data-k="${esc(i.k)}" role="checkbox" aria-checked="${st===1}" tabindex="0">
        <span class="box">${st===1?"✓":st===2?"casa":""}</span>
        <span class="txt"><span class="nm">${esc(i.n)}</span>${i.q?`<span class="qt">${esc(i.q)}</span>`:""}</span>
        ${i.x?`<button class="del" data-x="${esc(i.x)}" aria-label="Remover ${esc(i.n)}">×</button>`:`<button class="have" data-h="${esc(i.k)}">tenho</button>`}</div>`};
  let html="";
  Object.entries(grupos).forEach(([sec,arr])=>{
    const vis=filtro==="tudo"?arr:arr.filter(i=>!S.itens[i.k]);
    if(!vis.length)return;
    html+=`<div class="sec"><h4>${esc(sec)}<small>${arr.filter(i=>S.itens[i.k]).length}/${arr.length}</small></h4>${vis.map(row).join("")}</div>`;
  });
  if(!html)html=`<div class="sec"><div class="empty">Tudo resolvido nesta ida. Anote o valor pago abaixo.</div></div>`;
  const exVis=filtro==="tudo"?extras:extras.filter(i=>!S.itens[i.k]);
  html+=`<div class="sec"><h4>Extras<small>${extras.length?extras.filter(i=>S.itens[i.k]).length+"/"+extras.length:"fora da lista"}</small></h4>${exVis.map(row).join("")}
    <div class="add"><input id="novo" placeholder="Adicionar item a esta ida" autocomplete="off"><button class="btn" id="addbtn">Adicionar</button></div></div>`;
  $("lista").innerHTML=html;
  $("novo").value=txt;if(digitando)$("novo").focus();

  const nv=S.notas[trip];
  if(document.activeElement!==$("nota"))$("nota").value=nv!=null?nv.toLocaleString("pt-BR",{minimumFractionDigits:2}):"";
  const m=$("notamsg");
  if(nv==null){m.textContent=`Previsto para esta ida: ${brl(t.est)}`;m.className=""}
  else{const d=nv-t.est;m.textContent=d>0?`${brl(d)} acima do previsto`:`${brl(-d)} abaixo do previsto`;m.className=d>0?"bad":"good"}

  const ch=chegadaDe(t);
  $("chegada").innerHTML=`<h4>Ao chegar em casa<small>${ch.filter(c=>S.cheg[trip+"_"+c]).length}/${ch.length}</small></h4>`+
    ch.map(c=>{const on=S.cheg[trip+"_"+c];return `<div class="item${on?" cart":""}" data-c="${c}" role="checkbox" aria-checked="${!!on}" tabindex="0"><span class="box">${on?"✓":""}</span><span class="txt"><span class="nm">${CHEGADA[c]}</span></span></div>`}).join("");

  $("hist").innerHTML=S.hist.length?`<h3>Meses anteriores</h3><table><tr><th>Mês</th><th>Gasto</th><th>Diferença</th></tr>`+
    S.hist.slice().reverse().map(h=>{const d=h.gasto-h.est;return `<tr><td style="text-transform:capitalize">${mesNome(h.mes)}</td><td>${brl(h.gasto)}</td><td style="color:var(${d>0?"--red":"--green"})">${d>0?"+":"−"}${brl(Math.abs(d))}</td></tr>`}).join("")+"</table>":"";
}

/* ---------- Sincronização com a planilha (Apps Script) ----------
   Cada mudança vira uma operação {op:"set"|"del", path, value} ou {op:"replace", value, se}.
   As operações são aplicadas na hora aqui, ficam numa fila e são enviadas para o Apps Script,
   que aplica as mesmas operações no JSON guardado na planilha. Assim duas pessoas marcando
   itens ao mesmo tempo não apagam a marcação uma da outra. */

let API=ls.get("mercado_api")||"";
const apiParam=new URLSearchParams(location.search).get("api");
if(apiParam){API=apiParam;ls.set("mercado_api",API);history.replaceState(null,"",location.pathname)}

let fila=[];try{fila=JSON.parse(ls.get("mercado_fila")||"[]")}catch(e){}
let enviando=false, retry=null, versao=0;

const set=(path,value)=>({op:"set",path,value});
const del=path=>({op:"del",path});

// Mesma lógica do aplicar_() do apps-script/Codigo.gs
function aplicar(s,op){
  if(op.op==="replace"){if(op.se&&s&&s.mes!==op.se.mes)return s;return JSON.parse(JSON.stringify(op.value))}
  s=s||{};let o=s;
  for(let i=0;i<op.path.length-1;i++){const k=op.path[i];if(typeof o[k]!=="object"||o[k]===null)o[k]={};o=o[k]}
  const ult=op.path[op.path.length-1];
  if(op.op==="del")delete o[ult];else o[ult]=op.value;
  return s;
}
const normaliza=s=>Object.assign(novo(),s||{});

function status(t){$("sync").textContent=t}
function salvarLocal(){
  const ok=ls.set("mercado",JSON.stringify(S))&&ls.set("mercado_fila",JSON.stringify(fila));
  if(!API)status(ok?"Salvo só neste celular":"Não foi possível salvar neste navegador");
}

function muda(...ops){
  versao++;
  ops.forEach(op=>{S=normaliza(aplicar(S,op))});
  fila.push(...ops);
  render();salvarLocal();enviar();
}

function receber(estado){
  let s=normaliza(estado);
  fila.forEach(op=>{s=normaliza(aplicar(s,op))}); // o que ainda não subiu continua valendo
  S=s;render();salvarLocal();
}

async function enviar(){
  if(!API||enviando||!fila.length)return;
  enviando=true;clearTimeout(retry);retry=null;
  const lote=fila.slice();
  status("Sincronizando…");
  try{
    const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({ops:lote})});
    const j=await r.json();if(!j.ok)throw new Error(j.erro);
    fila=fila.slice(lote.length);versao++;
    receber(j.estado);
    status("Sincronizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){
    status(`Sem conexão · ${fila.length} alteração(ões) esperando para enviar`);
    retry=setTimeout(enviar,10000);
  }finally{enviando=false}
  if(fila.length&&!retry)enviar();
}

async function baixar(){
  if(!API||enviando||fila.length)return;
  const v=versao;
  try{
    const r=await fetch(API);const j=await r.json();if(!j.ok)throw new Error(j.erro);
    if(v!==versao||enviando||fila.length)return; // algo mudou enquanto baixava; a próxima rodada pega
    if(j.estado==null){fila.push({op:"replace",value:S});enviar();return} // planilha vazia: sobe o que tem aqui
    receber(j.estado);
    status("Sincronizado às "+new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}));
  }catch(e){status("Sem conexão com a planilha")}
}

/* ---------- Eventos ---------- */

document.addEventListener("click",e=>{
  const tb=e.target.closest("[data-t]");if(tb){trip=tb.dataset.t;render();window.scrollTo({top:$("trips").offsetTop-10});return}
  const fb=e.target.closest("[data-f]");if(fb){filtro=fb.dataset.f;document.querySelectorAll("[data-f]").forEach(b=>b.classList.toggle("on",b===fb));render();return}
  const h=e.target.closest("[data-h]");if(h){e.stopPropagation();const k=h.dataset.h;muda(S.itens[k]===2?del(["itens",k]):set(["itens",k],2));return}
  const x=e.target.closest("[data-x]");if(x){e.stopPropagation();const id=x.dataset.x;muda(del(["extras",trip,id]),del(["itens",trip+"_x_"+id]));return}
  const it=e.target.closest("[data-k]");if(it){const k=it.dataset.k;muda(S.itens[k]?del(["itens",k]):set(["itens",k],1));return}
  const c=e.target.closest("[data-c]");if(c){const k=trip+"_"+c.dataset.c;muda(S.cheg[k]?del(["cheg",k]):set(["cheg",k],1));return}
  if(e.target.id==="addbtn")addExtra();
  if(e.target.id==="salvanota")salvaNota();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="novo")addExtra();
  if(e.key==="Enter"&&e.target.id==="nota")salvaNota();
  if((e.key===" "||e.key==="Enter")&&e.target.matches(".item")){e.preventDefault();e.target.click()}
});
function addExtra(){const v=$("novo").value.trim();if(!v)return;$("novo").value="";muda(set(["extras",trip,Date.now().toString(36)],{n:v}));setTimeout(()=>$("novo")&&$("novo").focus(),0)}
function salvaNota(){const n=parse($("nota").value);$("nota").blur();muda(n==null?del(["notas",trip]):set(["notas",trip],n))}

$("fechar").onclick=()=>{const g=IDAS.reduce((s,t)=>s+(S.notas[t.id]||0),0);
  $("dlgtxt").textContent=`O gasto de ${mesNome(S.mes)} (${brl(g)}) vai para o histórico e a lista volta zerada para o próximo mês.`;$("dlg").showModal()};
$("dlgno").onclick=()=>$("dlg").close();
$("dlgok").onclick=()=>{$("dlg").close();
  const g=IDAS.reduce((s,t)=>s+(S.notas[t.id]||0),0);
  const[y,m]=S.mes.split("-").map(Number);const prox=m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,"0")}`;
  const n=novo(prox);n.hist=[...S.hist,{mes:S.mes,gasto:g,est:EST}].slice(-24);
  trip="i1";muda({op:"replace",value:n,se:{mes:S.mes}});window.scrollTo({top:0})};

$("config").onclick=()=>{$("apiurl").value=API;$("dlgapi").showModal()};
$("apino").onclick=()=>$("dlgapi").close();
$("apiok").onclick=()=>{$("dlgapi").close();API=$("apiurl").value.trim();ls.set("mercado_api",API);
  if(API){fila.length?enviar():baixar()}else salvarLocal()};

/* ---------- Início ---------- */

try{const l=ls.get("mercado");if(l)S=normaliza(JSON.parse(l))}catch(e){}
render();
if(API){status("Conectando à planilha…");fila.length?enviar():baixar()}else salvarLocal();
setInterval(()=>{if(!document.hidden)baixar()},15000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){fila.length?enviar():baixar()}});
</script>
</body>
